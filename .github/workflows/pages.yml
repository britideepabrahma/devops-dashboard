name: Publish status page

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"   # every hour
  workflow_dispatch:       # adds a manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for dashboard
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/health && break
            sleep 2
          done

      - name: Collect status snapshot
        run: |
          mkdir -p site
          cp static/index.html site/
          curl -sf http://localhost:5000/api/containers > site/containers.json
          curl -sf http://localhost:5000/api/system > site/system.json
          date -u +"%Y-%m-%d %H:%M UTC" > site/updated.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
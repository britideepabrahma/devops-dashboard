name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt flake8
      - run: flake8 app.py --max-line-length 120
      - run: docker build -t devops-dashboard .
      - name: Smoke test
        run: |
          docker run -d -p 5000:5000 --name test devops-dashboard
          sleep 5
          curl --fail http://localhost:5000/health

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for dashboard
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/health && break
            sleep 2
          done
      - name: Collect status snapshot
        run: |
          mkdir -p site
          cp static/index.html site/
          curl -sf http://localhost:5000/api/containers > site/containers.json
          curl -sf http://localhost:5000/api/system > site/system.json
          date -u +"%Y-%m-%d %H:%M UTC" > site/updated.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
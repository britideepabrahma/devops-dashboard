name: CI
on: [push]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt flake8
      - run: flake8 app.py --max-line-length 120
      - run: docker build -t ghcr.io/britideepabrahma/devops-dashboard:latest .

      - name: Smoke test
        run: |
          docker run -d -p 5000:5000 --name test ghcr.io/britideepabrahma/devops-dashboard:latest
          sleep 5
          curl --fail http://localhost:5000/health

      - name: Push to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/britideepabrahma/devops-dashboard:latest